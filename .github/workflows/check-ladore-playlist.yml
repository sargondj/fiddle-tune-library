name: Check L'Adore playlist for new tunes

on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 */3 * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Download playlist metadata
        env:
          LADORE_PLAYLIST_URL: "https://www.youtube.com/watch?v=YdekZGR-qLA&list=PLcV6BAqX_YFflBxey-VwMv2tEPKjIDFK_"
        run: |
          mkdir -p playlist-review
          yt-dlp --no-update --flat-playlist --dump-single-json "$LADORE_PLAYLIST_URL" > playlist-review/playlist.json

      - name: Check for new videos
        env:
          APPEND_NEW_PLAYLIST_ROWS: "true"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1t_dUenBfRTj_GyuefRiuSiowpt4i3DcdObk2UF-QTwU"
          GOOGLE_SHEET_RANGE: "A:J"
          LADORE_PLAYLIST_URL: "https://www.youtube.com/watch?v=YdekZGR-qLA&list=PLcV6BAqX_YFflBxey-VwMv2tEPKjIDFK_"
          LADORE_PLAYLIST_LABEL: "L'Adore Studio playlist"
          LADORE_CHANNEL_LABEL: "L'Adore Studio"
        run: npm run check:playlist -- playlist-review/playlist.json --append-to-sheet

      - name: Sync CSV from Google Sheet
        env:
          TUNES_CSV_URL: ${{ secrets.TUNES_CSV_URL }}
        run: npm run sync:csv

      - name: Commit CSV changes
        run: |
          if git diff --quiet -- public/data/tunes.csv; then
            echo "No CSV changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/tunes.csv
            git commit -m "Sync L'Adore playlist tunes"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify about new tunes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = 'playlist-review/result.json';

            if (!fs.existsSync(resultPath)) {
              core.info('No playlist result file found.');
              return;
            }

            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));

            if (!result.appended_rows || result.appended_rows < 1) {
              core.info('No new tunes were appended.');
              return;
            }

            const report = fs.existsSync('playlist-review/playlist-report.md')
              ? fs.readFileSync('playlist-review/playlist-report.md', 'utf8')
              : `${result.appended_rows} new tune row(s) were added.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New L'Adore tune rows added: ${result.appended_rows}`,
              body: [
                'The L\\'Adore playlist automation added new row(s) to the Google Sheet and redeployed the app.',
                '',
                report,
                '',
                `Deployment: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['playlist-update'],
            });

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladore-playlist-review
          path: playlist-review/
